# ASD & DevOps Lab - CI/CD Pipeline
name: ASD-DevOps-CI-Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Source Code
      uses: actions/checkout@v4

    - name: 2. Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Code Linting & Syntax Check
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 5. Run Automated Unit Tests
      run: |
        pytest test_app.py -v

    - name: 6. Build & Package Artifact
      run: |
        mkdir -p dist
        tar -czvf dist/app-release-v1.0.tar.gz app.py requirements.txt
        ls -lh dist/

    - name: 7. Automated Deployment Stage
      run: |
        echo "=== DEPLOYMENT STAGE ==="
        echo "Artifact dist/app-release-v1.0.tar.gz validated against unit tests."
        echo "Deploying to Production Target Server..."
        echo "Deployment Status: SUCCESSFUL"
